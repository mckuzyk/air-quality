[platformio]
default_envs = bench

[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200

[env:bench]
extends = esp32_base
build_flags = -DSAMPLE_PERIOD_MS=3000

[env:indoor]
extends = esp32_base
build_flags = -DSAMPLE_PERIOD_MS=30000

[env:native]
platform = native
extra_scripts = pre:native_clang.py
build_flags =
    -std=c++17
    -Wall
    -fsanitize=undefined
